  <style>
    :root {
      --bg-primary: #0f0f11;
      --bg-card: #1a1a1e;
      --bg-elevated: #232329;
      --border-subtle: #2a2a30;
      --border-hover: #3a3a44;
      --accent: #ff6b00;
      --accent-hover: #ff8124;
      --accent-glow: rgba(255, 107, 0, 0.25);
      --text-primary: #f5f5f7;
      --text-secondary: #9e9ea8;
      --text-muted: #6c6c76;
      --danger: #ff453a;
      --success: #32d74b;
      --font-display: 'Outfit', system-ui, sans-serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: calc(var(--tg-content-safe-area-inset-top, 48px) + var(--tg-safe-area-inset-top, 0px));
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans);
      font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden; min-height: 100dvh;
    }
    button, input, textarea { font-family: inherit; color: inherit; outline: none; }
    button { cursor: pointer; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Header */
    .app-header {
      position: sticky; top: 0; z-index: 30; background: rgba(15, 15, 17, 0.88);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(42, 42, 48, 0.7); padding-top: var(--safe-top);
    }
    .header-inner { max-width: 1152px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; text-align: left; min-width: 0; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #ff6b00 0%, #e05200 100%);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px var(--accent-glow); flex-shrink: 0;
    }
    .brand-logo svg { width: 20px; height: 20px; fill: #ffffff; }
    .brand-name { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 0.05em; color: #ffffff; white-space: nowrap; flex-shrink: 0; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .lang-switch { height: 44px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--bg-card); }
    .lang-icon { display: none; width: 14px; height: 14px; margin: 0 4px 0 6px; stroke: var(--text-secondary); fill: none; stroke-width: 2; flex-shrink: 0; }
    .lang-btn {
      font-family: var(--font-display); height: 34px; min-width: 38px; padding: 0 10px; border: none; border-radius: 8px;

    .lang-btn:hover { color: #ffffff; }
    .lang-btn.active { background: var(--accent); color: #ffffff; box-shadow: 0 2px 8px var(--accent-glow); }
    .header-cart-btn {
      position: relative; width: 44px; height: 44px; border-radius: 12px; background: var(--bg-card);
      border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease; flex-shrink: 0;

    .header-cart-btn:active { transform: scale(0.95); }
    .header-cart-btn svg { width: 20px; height: 20px; stroke: var(--text-primary); fill: none; stroke-width: 1.9; }
    .cart-badge {

    .back-btn {

      border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-primary); font-size: 13px;
      font-weight: 600; white-space: nowrap; transition: border-color 0.16s ease, background 0.16s ease;

    .store-subtitle { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .catalog-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

    .catalog-count { font-size: 12px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }

    /* Shared Grid */
    .cards-grid { padding: 0 16px calc(176px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

    /* Category Card */
    .category-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 10px; display: flex; flex-direction: column; text-align: left; transition: border-color 0.2s ease;

    .category-card:hover { border-color: var(--accent); }
    .category-img-box { width: 100%; aspect-ratio: 1 / 1; background: #ffffff; border-radius: 12px; overflow: hidden; position: relative; padding: 6px; }
    .category-img-box img { width: 100%; height: 100%; object-fit: contain; display: block; color: #1a1a1e; transition: transform 0.3s ease; }
    .category-card:hover .category-img-box img { transform: scale(1.04); }
    .category-body { padding-top: 12px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
    .category-count { font-size: 11px; font-weight: 600; color: var(--accent); }
    .category-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.25; flex: 1; }
    .category-desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .category-enter { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid rgba(42, 42, 48, 0.7); font-size: 12px; font-weight: 700; color: #ffffff; }
    .category-enter svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 2.3; transition: transform 0.16s ease; }
    .category-card:hover .category-enter svg { transform: translateX(3px); }

    /* Product Card */
    .product-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: border-color 0.2s ease;
      will-change: transform, opacity, filter;
    }
    .product-card:hover { border-color: var(--border-hover); }

    /* Stock Badge */
    .stock-badge {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: 8px; font-size: 10.5px; font-weight: 700; line-height: 1.25; margin-bottom: 8px;
      letter-spacing: 0.01em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    }
    .stock-badge.in-stock { background: rgba(50, 215, 75, 0.14); color: var(--success); border: 1px solid rgba(50, 215, 75, 0.28); }
    .stock-badge.low-stock { background: rgba(255, 107, 0, 0.14); color: var(--accent-hover); border: 1px solid rgba(255, 107, 0, 0.32); }
    .stock-badge.out-of-stock { background: rgba(108, 108, 118, 0.22); color: var(--text-secondary); border: 1px solid rgba(108, 108, 118, 0.38); }
    .product-card.is-out-of-stock .product-img-box img { opacity: 0.55; filter: grayscale(0.35); }

    .product-img-box { width: 100%; aspect-ratio: 1 / 1; background: #ffffff; border-radius: 12px; overflow: hidden; position: relative; padding: 6px; }
    .product-img-box img { width: 100%; height: 100%; object-fit: contain; display: block; color: #1a1a1e; transition: transform 0.3s ease; }
    .product-card:hover .product-img-box img { transform: scale(1.03); }
    .product-body { padding-top: 12px; display: flex; flex-direction: column; flex: 1; }
    .product-meta-line { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
    .product-meta-model { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--accent); }
    .product-meta-volt { flex-shrink: 0; color: var(--text-secondary); }
    .product-title {
      font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-primary);
      line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-specs {
      font-size: 11.5px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 12px; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-price { font-family: var(--font-display); font-size: 16px; font-weight: 800; color: #ffffff; margin-bottom: 10px; letter-spacing: -0.01em; text-align: center; }
    .product-price span { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 3px; }
    .add-btn {
      width: auto; min-width: min(100%, 146px); max-width: 100%; margin: auto auto 0; min-height: 44px;
      border-radius: 12px; border: none; background: var(--accent); color: #ffffff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; white-space: nowrap;
      transition: background 0.16s ease, transform 0.14s ease;
    }
    .add-btn:hover { background: var(--accent-hover); }
    .add-btn:active { transform: scale(0.97); }
    .add-btn:disabled, .pm-add-btn:disabled { background: #2a2a30; color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }
    .add-btn:disabled:hover, .pm-add-btn:disabled:hover { background: #2a2a30; }
    .add-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; flex-shrink: 0; }

    .card-stepper {
      width: 100%; max-width: 196px; margin: auto auto 0; min-height: 44px; border-radius: 12px;
      background: var(--bg-elevated); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
    }
    .stepper-btn {
      width: 36px; height: 36px; border-radius: 8px; border: none; background: rgba(255, 107, 0, 0.15); color: var(--accent);
      font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .stepper-btn:hover, .stepper-btn:active { background: var(--accent); color: #ffffff; }
    .stepper-btn:disabled, .ci-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .stepper-btn:disabled:hover, .stepper-btn:disabled:active { background: rgba(255, 107, 0, 0.15); color: var(--accent); }
    .ci-btn:disabled:hover, .ci-btn:disabled:active { background: var(--bg-elevated); color: #ffffff; }
    .stepper-qty { font-family: var(--font-display); font-size: 13.5px; font-weight: 700; color: #ffffff; }

    /* Scroll Veil Overlay */
    .scroll-veil {
      pointer-events: none; position: absolute; inset: 0; border-radius: 16px; opacity: 0; will-change: opacity;
      background: linear-gradient(to top, rgba(15, 15, 17, 0.96) 22%, rgba(15, 15, 17, 0.72) 62%, rgba(15, 15, 17, 0.18) 100%);
    }
    .bottom-mist {
      pointer-events: none; position: fixed; left: 0; right: 0; bottom: calc(64px + var(--safe-bottom)); z-index: 20;
      height: 76px; background: linear-gradient(to top, #0f0f11 0%, rgba(15, 15, 17, 0.65) 55%, transparent 100%);
      opacity: 1; transition: opacity 0.3s ease;
    }
    .bottom-mist.hidden { opacity: 0; }

    /* Floating Bottom Cart Bar */
    .floating-cart-wrap {
      position: fixed; left: 0; right: 0; bottom: calc(70px + var(--safe-bottom)); z-index: 31; max-width: 576px;
      margin: 0 auto; padding: 0 16px 8px; transform: translateY(140%); opacity: 0; pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }
    .floating-cart-wrap.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }

    /* About Us View */
    .about-view { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(176px + var(--safe-bottom)); display: none; flex-direction: column; gap: 14px; }
    .about-view.active { display: flex; }
    .about-hero { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
    .about-brand-row { display: flex; align-items: center; gap: 12px; }
    .about-brand-icon {
      width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, #ff6b00 0%, #e05200 100%);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px var(--accent-glow); flex-shrink: 0;
    }
    .about-brand-icon svg { width: 24px; height: 24px; fill: #ffffff; }
    .about-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: #ffffff; line-height: 1.2; }
    .about-subtitle { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .about-desc { font-size: 13.5px; color: #d0d0d8; line-height: 1.6; }
    .about-section-label { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-secondary); padding: 4px 2px 0; }
    .contact-list { display: flex; flex-direction: column; gap: 10px; }
    .contact-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 14px 16px; min-height: 68px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--text-primary);
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.14s ease;
    }
    .contact-card:hover { border-color: var(--accent); background: var(--bg-elevated); }
    .contact-card:active { transform: scale(0.985); }
    .contact-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .contact-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .contact-icon.ig { background: linear-gradient(135deg, rgba(225, 48, 108, 0.2), rgba(255, 107, 0, 0.2)); color: #ff5a87; }
    .contact-icon.tg { background: rgba(42, 171, 238, 0.16); color: #38bdf8; }
    .contact-icon.ph { background: rgba(50, 215, 75, 0.16); color: #32d74b; }
    .contact-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .contact-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .contact-k { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .contact-v { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-arrow { width: 18px; height: 18px; stroke: var(--text-secondary); fill: none; stroke-width: 2.2; flex-shrink: 0; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 32; background: rgba(15, 15, 17, 0.94);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(42, 42, 48, 0.85);
      padding: 6px 16px calc(8px + var(--safe-bottom));
    }
    .bottom-nav-inner { max-width: 576px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .bottom-nav-btn {
      min-height: 48px; border: none; border-radius: 12px; background: transparent; color: var(--text-secondary);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 8px;
      font-family: var(--font-display); font-size: 11.5px; font-weight: 700; white-space: nowrap;
      transition: color 0.16s ease, background 0.16s ease;
    }
    .bottom-nav-btn:hover { color: #ffffff; }
    .bottom-nav-btn.active { color: var(--accent); background: rgba(255, 107, 0, 0.11); }
    .bottom-nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .floating-cart-bar {
      width: 100%; min-height: 52px; border: none; border-radius: 16px; background: linear-gradient(135deg, #ff6b00 0%, #e85a00 100%);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; color: #ffffff;
      box-shadow: 0 12px 28px rgba(255, 107, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.45); transition: transform 0.15s ease;
    }
    .floating-cart-bar:active { transform: scale(0.985); }
    .fcb-left { display: flex; align-items: center; gap: 10px; }
    .fcb-count { font-family: var(--font-display); background: rgba(0, 0, 0, 0.25); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .fcb-label { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .fcb-total { font-family: var(--font-display); font-size: 15px; font-weight: 800; white-space: nowrap; }

    /* Product Detail Modal (PDP) */
    .modal-backdrop { position: fixed; inset: 0; z-index: 42; background: rgba(0, 0, 0, 0.76); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .product-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 45; width: 100%; height: 100dvh; max-height: 100dvh;
      margin: 0 auto; background: var(--bg-card); border: none; border-radius: 0; display: flex; flex-direction: column;
      transform: translateY(104%); pointer-events: none; transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.7);

    .product-modal.open { transform: translateY(0); pointer-events: auto; }
    .product-modal .sheet-handle-wrap { display: none; }
    .pm-header { padding: calc(12px + var(--safe-top)) 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
    .pm-header-meta { font-size: 13px; font-weight: 600; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-header-meta span { color: var(--accent); }
    .pm-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 26px; display: block; }
    .pm-scroll > * + * { margin-top: 16px; }

    /* Gallery */
    .gallery-stage { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 400px; border-radius: 16px; background: #ffffff; overflow: hidden; user-select: none; touch-action: pan-y; padding: 10px; }
    .gallery-stage img { width: 100%; height: 100%; object-fit: contain; display: block; background: #ffffff; color: #1a1a1e; }
    .gallery-nav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(15, 15, 17, 0.72); color: #ffffff;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); transition: background 0.16s ease;
    }
    .gallery-nav:hover { background: var(--accent); border-color: var(--accent); }
    .gallery-nav.prev { left: 10px; }
    .gallery-nav.next { right: 10px; }
    .gallery-nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.3; }
    .gallery-counter { font-family: var(--font-display); position: absolute; bottom: 10px; right: 10px; padding: 4px 9px; border-radius: 8px; background: rgba(15, 15, 17, 0.78); color: #ffffff; font-size: 11px; font-weight: 700; }
    .gallery-thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .gallery-thumb { aspect-ratio: 1 / 1; border-radius: 10px; border: 2px solid var(--border-subtle); background: #ffffff; overflow: hidden; padding: 2px; transition: border-color 0.16s ease, transform 0.14s ease; }

        const step = Number(img.getAttribute('data-fb-step') || '0');
        if (step === 0 && img.src.indexOf(GH_CDN_BASE) === -1) {
          img.setAttribute('data-fb-step', '1');
          img.src = GH_CDN_BASE + orig;
        } else if (step <= 1 && img.src.indexOf(GH_RAW_BASE) === -1) {

      function getProductStock(productId) {
        const key = String(productId);
        if (Object.prototype.hasOwnProperty.call(stockMap, key)) {
          const val = Number(stockMap[key]);
          return Number.isFinite(val) && val > 0 ? Math.floor(val) : 0;
        }
        return 10;
      }

      function getStockBadgeHtml(productId) {
        const t = TRANSLATIONS[lang];
        const qty = getProductStock(productId);
        if (qty <= 0) {
          return '<div class="stock-badge out-of-stock">' + escapeHtml(t.outOfStock) + '</div>';
        }
        const cls = qty <= 3 ? 'low-stock' : 'in-stock';
        return '<div class="stock-badge ' + cls + ' tabular-nums">' + escapeHtml(t.stockRemaining(qty)) + '</div>';
      }

      function clampCartToStock() {
        let changed = false;
        for (let i = cart.length - 1; i >= 0; i--) {
          const avail = getProductStock(cart[i].id);
          if (avail <= 0) {
            cart.splice(i, 1);
            changed = true;
          } else if (cart[i].qty > avail) {
            cart[i].qty = avail;
            changed = true;
          }
        }
        return changed;
      }

      async function fetchStock() {
        try {
          const response = await fetch('/api/stock?t=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) return;
          const data = await response.json();
          const nextStock = data && data.stock ? data.stock : data;
          if (nextStock && typeof nextStock === 'object') {
            stockMap = nextStock;
            clampCartToStock();
            updateUI();
          }
        } catch (_) {}
      }

      function getCartStats() {
        let totalQty = 0, totalAmount = 0;
        for (let i = 0; i < cart.length; i++) {
          totalQty += cart[i].qty;
          totalAmount += cart[i].price * cart[i].qty;
        }
        return { totalQty: totalQty, totalAmount: totalAmount };
      }

      function getItemQty(productId) {
        for (let i = 0; i < cart.length; i++) {
          if (cart[i].id === productId) return cart[i].qty;
        }
        return 0;
      }

      function addToCart(productId, notifyUser) {
        const product = PRODUCTS.find(function (p) { return p.id === productId; });
        if (!product) return;
        const t = TRANSLATIONS[lang];
        const available = getProductStock(productId);
        if (available <= 0) { showToast(t.outOfStock); return; }
        const currentQty = getItemQty(productId);
        if (currentQty >= available) { showToast(t.maxStockReached(available)); return; }

        confirmedOrder = null;
        const existing = cart.find(function (item) { return item.id === productId; });
        if (existing) existing.qty += 1;
        else cart.push(Object.assign({}, product, { qty: 1 }));
        haptic('light');
        if (notifyUser) showToast(t.toastAdded);
        updateUI();
      }

      function changeQty(productId, delta) {
        const idx = cart.findIndex(function (item) { return item.id === productId; });
        if (idx === -1) return;
        const t = TRANSLATIONS[lang];
        const available = getProductStock(productId);
        if (delta > 0 && cart[idx].qty + delta > available) {
          showToast(t.maxStockReached(available));
          return;
        }
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        haptic('light');
        updateUI();
      }

      let holdTimerId = null, holdIntervalId = null, holdResetClickTimerId = null;
      let holdDidRepeat = false, holdProductId = null, holdDelta = 0, holdStepCount = 0;

      function stopHoldRepeat() {
        if (holdTimerId !== null) { clearTimeout(holdTimerId); holdTimerId = null; }
        if (holdIntervalId !== null) { clearTimeout(holdIntervalId); holdIntervalId = null; }
        holdProductId = null; holdDelta = 0; holdStepCount = 0;
      }

      function applyQtyStepInPlace(productId, delta) {
        const idx = cart.findIndex(function (item) { return item.id === productId; });
        if (idx === -1) { stopHoldRepeat(); return; }
        const t = TRANSLATIONS[lang];
        const available = getProductStock(productId);
        if (delta > 0 && cart[idx].qty >= available) {
          stopHoldRepeat();
          showToast(t.maxStockReached(available));
          return;
        }
        const nextQty = cart[idx].qty + delta;
        if (nextQty <= 0) {
          cart.splice(idx, 1);
          stopHoldRepeat();
          haptic('light');
          updateUI();
          return;
        }
        cart[idx].qty = nextQty;
        haptic('light');

        const reachedMax = nextQty >= available;
        const cardQtyEl = cardsGrid.querySelector('[data-card-qty-val="' + productId + '"]');
        if (cardQtyEl) cardQtyEl.textContent = nextQty + ' ' + t.unitShort;
        const cardIncBtn = cardsGrid.querySelector('[data-qty-id="' + productId + '"][data-delta="1"]');
        if (cardIncBtn) cardIncBtn.disabled = reachedMax;

        const pmQtyEl = document.getElementById('pmStepperQty');
        if (pmQtyEl && activeProductId === productId) pmQtyEl.textContent = nextQty + ' ' + t.unitShort;
        const pmIncBtn = document.getElementById('pmIncBtn');
        if (pmIncBtn && activeProductId === productId) pmIncBtn.disabled = reachedMax;

        const cartQtyEl = sheetBody.querySelector('[data-cart-qty-val="' + productId + '"]');
        if (cartQtyEl) cartQtyEl.textContent = nextQty;
        const cartIncBtn = sheetBody.querySelector('[data-qty-id="' + productId + '"][data-delta="1"]');
        if (cartIncBtn) cartIncBtn.disabled = reachedMax;
        const cartSubEl = sheetBody.querySelector('[data-cart-sub-val="' + productId + '"]');
        if (cartSubEl) cartSubEl.innerHTML = formatPrice(cart[idx].price * nextQty) + ' ' + escapeHtml(t.currency);
        const cartSumEl = document.getElementById('cartSummaryTotal');
        if (cartSumEl) {
          const stats = getCartStats();
          cartSumEl.innerHTML = formatPrice(stats.totalAmount) + ' <span>' + escapeHtml(t.currency) + '</span>';
        }
        updateCartIndicators();
        if (delta > 0 && reachedMax) stopHoldRepeat();
      }

      function scheduleNextHoldTick() {
        if (holdProductId === null) return;
        const delay = holdStepCount >= 10 ? 55 : holdStepCount >= 4 ? 85 : 120;
        holdIntervalId = setTimeout(function () {
          if (holdProductId === null) return;
          holdDidRepeat = true; holdStepCount += 1;
          applyQtyStepInPlace(holdProductId, holdDelta);
          if (holdProductId !== null) scheduleNextHoldTick();
        }, delay);
      }

      function startHoldRepeat(productId, delta) {
        stopHoldRepeat();
        if (holdResetClickTimerId !== null) { clearTimeout(holdResetClickTimerId); holdResetClickTimerId = null; }
        holdDidRepeat = false; holdProductId = productId; holdDelta = delta; holdStepCount = 0;
        holdTimerId = setTimeout(function () {
          if (holdProductId === null) return;
          holdDidRepeat = true; holdStepCount = 1;
          applyQtyStepInPlace(holdProductId, holdDelta);
          if (holdProductId !== null) scheduleNextHoldTick();
        }, 320);
      }

      function releaseHoldRepeat() {
        if (holdProductId === null && holdTimerId === null && holdIntervalId === null) return;
        stopHoldRepeat();
        if (holdDidRepeat) {
          if (holdResetClickTimerId !== null) clearTimeout(holdResetClickTimerId);
          holdResetClickTimerId = setTimeout(function () { holdDidRepeat = false; holdResetClickTimerId = null; }, 80);
        }
      }

        aboutView.classList.remove('active');

        if (!selectedCategoryId) {

          catalogTitle.textContent = t.categoriesTitle;
          catalogCount.textContent = t.categoriesCount(CATEGORIES.length);

          cardsGrid.innerHTML = CATEGORIES.map(function (cat) {

      async function handleOrderSubmit(e) {
        e.preventDefault();
        const t = TRANSLATIONS[lang];
        const name = checkoutState.name.trim();
        const phone = checkoutState.phone.trim();
        const isDelivery = checkoutState.delivery === 'Yetkazib berish';
        const address = isDelivery ? checkoutState.address.trim() : t.pickupAddressValue;

        formErrorMsg = ''; fieldError = null;
        if (!name) { fieldError = 'name'; formErrorMsg = t.errName; renderBottomSheet(); document.getElementById('inputName')?.focus(); return; }
        if (!phone || phone.replace(/\D/g, '').length < 7) { fieldError = 'phone'; formErrorMsg = t.errPhone; renderBottomSheet(); document.getElementById('inputPhone')?.focus(); return; }
        if (isDelivery && !address) { fieldError = 'address'; formErrorMsg = t.errAddress; renderBottomSheet(); document.getElementById('inputAddress')?.focus(); return; }

        const stats = getCartStats();
        isSubmitting = true;
        renderBottomSheet();

        try {
          const response = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name, phone: phone, delivery: checkoutState.delivery, address: address, payment: checkoutState.payment, lang: lang,
              items: cart.map(function (item) {
                return { id: item.id, model: item.model, name: lang === 'ru' ? item.nameRu : item.name, price: item.price, qty: item.qty, subtotal: item.price * item.qty };
              }),
              total: stats.totalAmount, user_id: tgUser ? tgUser.id : null, tg_user: tgUser
            })
          });

          const data = await response.json().catch(function () { return {}; });
          if (response.status === 409 && data.error === 'insufficient_stock') {
            if (data.stock && typeof data.stock === 'object') {
              stockMap = data.stock;
              clampCartToStock();
            }
            isSubmitting = false;
            formErrorMsg = t.errInsufficientStock;
            updateUI();
            return;
          }
          if (!response.ok) throw new Error(data.error || 'Server error');

          if (data.stock && typeof data.stock === 'object') stockMap = data.stock;
          haptic('success');
          showToast(t.toastAccepted);
          confirmedOrder = { orderId: data.orderId || 'ONX-1001', total: stats.totalAmount };
          cart = []; isSubmitting = false; updateUI();

          if (tg && tg.initData) {
            setTimeout(function () { tg.close(); }, 700);
          }
        } catch (_) {
          isSubmitting = false;
          formErrorMsg = t.errServer;
          renderBottomSheet();
        }
      }

      function applyRowScrollClarity() {
        const cards = Array.prototype.slice.call(cardsGrid.querySelectorAll('.scroll-card'));
        if (cards.length === 0) return;
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          cards.forEach(function (el) {
            el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none';
            const veil = el.querySelector('[data-scroll-veil]');
            if (veil) veil.style.opacity = '0';
          });
          bottomMist.classList.add('hidden');
          return;
        }
        const vh = window.innerHeight || 800;
        const docHeight = document.documentElement.scrollHeight;
        const remainingScroll = Math.max(0, docHeight - (window.scrollY + vh));
        bottomMist.classList.toggle('hidden', remainingScroll <= 24);

        const rows = [];
        cards.forEach(function (el) {
          const top = el.offsetTop, lastRow = rows[rows.length - 1];
          if (lastRow && Math.abs(lastRow[0].offsetTop - top) <= 10) lastRow.push(el);
          else rows.push([el]);
        });
        const startRevealY = vh * 0.95, fullClearY = vh * 0.62, span = Math.max(120, startRevealY - fullClearY);
        const endOfPageBoost = remainingScroll < 140 ? 1 - remainingScroll / 140 : 0;

        rows.forEach(function (rowCards, rowIndex) {
          const rect = rowCards[0].getBoundingClientRect();
          let rawProgress = (rowIndex === 0 && rect.top < vh * 0.85) ? 1 : Math.min(1, Math.max(0, (startRevealY - rect.top) / span));
          if (endOfPageBoost > 0 && rect.top < vh * 0.96) rawProgress = Math.min(1, rawProgress + endOfPageBoost * (1 - rawProgress));
          const eased = 1 - Math.pow(1 - rawProgress, 2.2);
          const opacity = (0.14 + 0.86 * eased).toFixed(3);
          const translateY = ((1 - eased) * 32).toFixed(2);
          const scale = (0.92 + 0.08 * eased).toFixed(4);
          const blurPx = ((1 - eased) * 8.5).toFixed(2);
          const saturate = (0.65 + 0.35 * eased).toFixed(3);
          const veilOpacity = ((1 - eased) * 0.92).toFixed(3);

          rowCards.forEach(function (cardEl) {
            cardEl.style.opacity = opacity;
            cardEl.style.transform = 'translate3d(0, ' + translateY + 'px, 0) scale(' + scale + ')';
            cardEl.style.filter = eased >= 0.995 ? 'none' : 'blur(' + blurPx + 'px) saturate(' + saturate + ')';
            const veil = cardEl.querySelector('[data-scroll-veil]');
            if (veil) veil.style.opacity = veilOpacity;
          });
        });
      }

          e.preventDefault();
          try { tg.openLink('https://www.instagram.com/onex_uz/', { try_instant_view: false }); }
          catch (_) { window.location.href = 'https://www.instagram.com/onex_uz/'; }
        }
      });
      contactTelegram.addEventListener('click', function (e) {
        haptic('light');
        if (tg && tg.openTelegramLink) {
          e.preventDefault();
          try { tg.openTelegramLink('https://t.me/onex_by'); }
          catch (_) { window.location.href = 'https://t.me/onex_by'; }
        }
      });
      contactPhone.addEventListener('click', function () { haptic('light'); });
      backToCatsBtn.addEventListener('click', goToCategories);

      langBtnUz.addEventListener('click', function () {
        if (lang === 'uz') return;
        lang = 'uz'; saveLang('uz'); formErrorMsg = ''; haptic('light'); updateUI();
      });
      langBtnRu.addEventListener('click', function () {
        if (lang === 'ru') return;
        lang = 'ru'; saveLang('ru'); formErrorMsg = ''; haptic('light'); updateUI();
      });

      cardsGrid.addEventListener('click', function (e) {
        const catCard = e.target.closest('[data-cat-id]');
        if (catCard) { selectedCategoryId = catCard.getAttribute('data-cat-id'); haptic('light'); renderCatalogView(); window.scrollTo({ top: 0, behavior: 'auto' }); return; }
        const addBtn = e.target.closest('[data-add-id]');
        if (addBtn) { e.stopPropagation(); addToCart(Number(addBtn.getAttribute('data-add-id')), true); return; }
        const qtyBtn = e.target.closest('[data-qty-id]');
        if (qtyBtn) {
          e.stopPropagation();
          if (holdDidRepeat) { holdDidRepeat = false; return; }
          changeQty(Number(qtyBtn.getAttribute('data-qty-id')), Number(qtyBtn.getAttribute('data-delta')));
          return;
        }
        const productCard = e.target.closest('[data-open-product]');
        if (productCard) openProductModal(Number(productCard.getAttribute('data-open-product')));
      });

      pmBody.addEventListener('click', function (e) {
        const thumbBtn = e.target.closest('[data-thumb-idx]');
        if (thumbBtn) { activeSlideIdx = Number(thumbBtn.getAttribute('data-thumb-idx')); haptic('light'); renderProductModal(); }
      });
      closeProductBtn.addEventListener('click', closeProductModal);
      productBackdrop.addEventListener('click', closeProductModal);

      sheetBody.addEventListener('click', function (e) {
        const qtyBtn = e.target.closest('[data-qty-id]');
        if (qtyBtn) {
          if (holdDidRepeat) { holdDidRepeat = false; return; }
          changeQty(Number(qtyBtn.getAttribute('data-qty-id')), Number(qtyBtn.getAttribute('data-delta')));
          return;
        }
        const deliveryBtn = e.target.closest('[data-delivery]');
        if (deliveryBtn) { checkoutState.delivery = deliveryBtn.getAttribute('data-delivery'); haptic('light'); renderBottomSheet(); return; }
        const paymentBtn = e.target.closest('[data-payment]');
        if (paymentBtn) { checkoutState.payment = paymentBtn.getAttribute('data-payment'); haptic('light'); renderBottomSheet(); }
      });

      document.addEventListener('pointerdown', function (e) {
        if (e.button !== undefined && e.button !== 0) return;
        const qtyBtn = e.target.closest('[data-qty-id]');
        if (!qtyBtn) return;
        const id = Number(qtyBtn.getAttribute('data-qty-id'));
        const delta = Number(qtyBtn.getAttribute('data-delta'));
        if (!id || !delta) return;
        startHoldRepeat(id, delta);
      });
      document.addEventListener('pointerup', releaseHoldRepeat);
      document.addEventListener('pointercancel', releaseHoldRepeat);
      window.addEventListener('blur', releaseHoldRepeat);
      document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-qty-id]')) e.preventDefault(); });

      headerCartBtn.addEventListener('click', openBottomSheet);
      floatingCartBtn.addEventListener('click', openBottomSheet);
      closeSheetBtn.addEventListener('click', closeBottomSheet);
      sheetBackdrop.addEventListener('click', closeBottomSheet);

      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (cartSheet.classList.contains('open')) closeBottomSheet();
          else if (productModal.classList.contains('open')) closeProductModal();
        }
      });
      window.addEventListener('scroll', scheduleRowScrollClarity, { passive: true });
      window.addEventListener('resize', scheduleRowScrollClarity, { passive: true });

      updateUI();
      fetchStock();
    })();
  </script>
</body>
</html>
